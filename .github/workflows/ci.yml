# Create: .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, lint & smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install system deps (apt) for BPF optional support
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libelf-dev linux-headers-$(uname -r) || true

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest || true

      - name: Syntax check (compile)
        run: python -m compileall .

      - name: Lint (flake8)
        run: |
          # allow lint to fail without failing the workflow in projects with no strict linting yet
          flake8 || echo "flake8 issues (non-blocking)"

      - name: Run pytest (if tests present)
        run: |
          if [ -d tests ] || ls test_*.py 1>/dev/null 2>&1; then
            pytest -q
          else
            echo "No tests detected; skipping pytest."
          fi
