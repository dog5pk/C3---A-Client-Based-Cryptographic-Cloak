name: D-Bridge CI Selftest

on:
  workflow_dispatch:
  push:
    branches: [ ci-wireup, main ]

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: CI selftest (spawn relays)
        shell: bash
        run: bash scripts/ci_selftest.sh

      - name: Pack release
        if: ${{ success() }}
        run: bash scripts/pack_release.sh

      - name: Verify checksum
        if: ${{ success() }}
        run: sha256sum -c dbridge_release_*.tar.gz.sha256

      - name: Upload artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: dbridge-artifact
          path: |
            dbridge_release_*.tar.gz
            dbridge_release_*.tar.gz.sha256
