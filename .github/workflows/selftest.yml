name: D-Bridge CI Selftest
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.22.x' }
      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Install Python deps
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install cryptography
      - name: CI selftest (spawn relays, traced)
        run: |
          set -euxo pipefail
          bash -x scripts/ci_selftest.sh
      - name: Pack release (traced)
        run: |
          set -euxo pipefail
          bash -x scripts/pack_release.sh
      - name: Verify checksum (explicit)
        run: |
          set -euxo pipefail
          bash -x scripts/verify_release.sh || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbridge-artifact
          path: |
            dbridge_release_*.tar.gz
            dbridge_release_*.tar.gz.sha256
          if-no-files-found: warn
