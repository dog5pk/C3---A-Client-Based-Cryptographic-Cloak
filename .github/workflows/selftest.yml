name: D-Bridge CI Selftest
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: System build deps
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y build-essential python3-dev

      - name: CI selftest (traced)
        run: |
          set -euxo pipefail
          bash -x scripts/ci_selftest.sh

      - name: Pack release (traced)
        run: |
          set -euxo pipefail
          bash -x scripts/pack_release.sh

      - name: Verify checksum (traced)
        run: |
          set -euxo pipefail
          bash -x scripts/verify_release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbridge-artifact
          path: |
            dbridge_release_*.tar.gz
            dbridge_release_*.tar.gz.sha256
          if-no-files-found: error
