name: D-Bridge CI Selftest

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: CI selftest (spawn relays)
        run: |
          bash scripts/ci_selftest.sh

      - name: Pack release
        run: |
          bash scripts/pack_release.sh

      - name: Verify checksum
        run: |
          bash scripts/verify_release.sh || true
