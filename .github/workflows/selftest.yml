name: D-Bridge CI Selftest
on:
  workflow_dispatch:
  push:
    branches:
      - ci-wireup
      - revert-ci-noise
      - main
    paths:
      - 'client/**'
      - 'relays/**'
      - 'scripts/**'
      - '.github/workflows/selftest.yml'

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Setup Python (pin for cryptography wheels)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f client/requirements.txt ]; then
            python -m pip install -r client/requirements.txt
          else
            python -m pip install cryptography==41.*
          fi

      - name: CI selftest (spawn relays)
        run: bash scripts/ci_selftest.sh
